[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "khonsu-calendar"
version = "0.1.0"
description = "Convert Khonsu pass-plan JSON to an iCalendar file"
requires-python = ">=3.10"

[project.scripts]
khonsu-calendar = "khonsu_calendar:main"

[tool.setuptools]
py-modules = ["khonsu_calendar"]
