# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.23'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pkg/templates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: pkg/templates/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify committed viewer bundle
        run: git diff --exit-code -- viewer.bundle.js

  extensions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.23'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install calendar example and schema validator
        run: python -m pip install ./examples/calendar jsonschema==4.26.0
      - name: Test independent calendar consumer
        run: python -m unittest discover -s examples/calendar -v
      - name: Build host and convert an offline pass plan
        shell: bash
        run: |
          go build -o /tmp/tlego .
          /tmp/tlego passes --file examples/tui-demo/iss.tle --time 2026-10-24T05:01:11Z --lat 51.48 --lon 0 --format json | /tmp/tlego calendar > /tmp/passes.ics
          python -c 'from pathlib import Path; data=Path("/tmp/passes.ics").read_bytes(); assert data.startswith(b"BEGIN:VCALENDAR\r\n"); assert b"BEGIN:VEVENT" in data; assert data.endswith(b"END:VCALENDAR\r\n")'
      - name: Test generated Python starter
        run: |
          /tmp/tlego plugin init summary --language python --dir /tmp/tlego-summary
          python -m unittest discover -s /tmp/tlego-summary -v
          python -m pip install /tmp/tlego-summary
          /tmp/tlego summary < docs/fixtures/position-v1.json
      - name: Validate transport fixtures
        run: |
          python - <<'PYTHON'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker
          schema = json.loads(Path("docs/schema-v1.json").read_text())
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          for path in Path("docs/fixtures").glob("*-v1.json"):
              errors = list(validator.iter_errors(json.loads(path.read_text())))
              assert bool(errors) == path.name.startswith("invalid-"), (str(path), errors)
          PYTHON
