name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          # Binaries ship with this Go, so keep it on a supported release.
          go-version: "1.26"
          cache: true
      - name: Test
        run: go test ./...
      - name: Smoke test before publishing
        run: |
          go build -o /tmp/khonsu -ldflags "-X github.com/Mohammed-Ashour/khonsu/cmd.Version=${GITHUB_REF_NAME}" .
          /tmp/khonsu --version | grep -F "${GITHUB_REF_NAME}"
          /tmp/khonsu predict --file examples/tui-demo/iss.tle --time 2026-10-24T05:01:11Z --format json > /dev/null
          # The web app must be served from the binary, away from the checkout.
          (cd /tmp && /tmp/khonsu web --no-open --addr 127.0.0.1:18080 --file "$GITHUB_WORKSPACE/examples/tui-demo/iss.tle" & echo $! > /tmp/khonsu.pid)
          sleep 2
          curl -fsS http://127.0.0.1:18080/ | grep -q app.js
          curl -fsS -o /dev/null http://127.0.0.1:18080/app.js
          curl -fsS -o /dev/null "http://127.0.0.1:18080/api/v1/position?norad_id=25544&time=2026-10-24T05:01:11Z"
          kill "$(cat /tmp/khonsu.pid)"
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
      - name: Keep package manager manifests
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: package-manifests
          path: |
            dist/homebrew/**
            dist/scoop/**
          if-no-files-found: warn
