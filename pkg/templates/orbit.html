<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>TLEGO · Orbit viewer</title>
  <style>{{.CSS}}</style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="TLEGO orbit viewer home">
        <span class="brand-mark" aria-hidden="true"><i></i><b></b></span>
        <span>TLEGO</span>
      </a>
      <div class="topbar-context">
        <span class="eyebrow">ORBIT VIEWER</span>
        <span class="context-separator" aria-hidden="true"></span>
        <span id="mission-label">Orbit analysis</span>
      </div>
      <div class="topbar-meta"><span class="live-dot" aria-hidden="true"></span><span id="system-status">LOCAL DATA</span></div>
    </header>

    <main class="workspace">
      <section class="viewport" aria-label="Three-dimensional satellite orbit viewer">
        <div id="scene" class="scene"></div>
        <div class="scene-wash" aria-hidden="true"></div>
        <div class="scene-heading">
          <p class="eyebrow">EARTH · TEME FRAME</p>
          <h1>Orbital paths</h1>
          <p id="scene-summary" class="scene-summary">Satellite positions at a shared UTC time</p>
        </div>
        <div class="scene-scale"><span class="scale-line" aria-hidden="true"></span><span>Earth radius <b id="earth-radius">—</b></span></div>
        <div class="camera-tools" aria-label="Camera controls">
          <button id="camera-home" class="icon-button" type="button" aria-label="Reset camera" title="Reset camera">⌂</button>
          <button id="zoom-in" class="icon-button" type="button" aria-label="Zoom in" title="Zoom in">+</button>
          <button id="zoom-out" class="icon-button" type="button" aria-label="Zoom out" title="Zoom out">−</button>
          <button id="rotate-toggle" class="icon-button rotate-button" type="button" aria-label="Enable camera rotation" aria-pressed="false" title="Enable camera rotation">↻</button>
        </div>
        <div id="scene-error" class="scene-error" role="alert" hidden></div>
        <div id="webgl-note" class="webgl-note" hidden></div>
        <p id="viewer-announcement" class="sr-only" aria-live="polite"></p>
      </section>

      <aside class="inspector" aria-label="Orbit details">
        <div class="inspector-top">
          <div>
            <p class="eyebrow">OBJECTS</p>
            <h2>Satellites <span id="satellite-count" class="count">0</span></h2>
          </div>
          <span class="orbit-glyph" aria-hidden="true">◎</span>
        </div>
        <div id="satellite-list" class="satellite-list" role="listbox" aria-label="Select a satellite"></div>
        <div class="inspector-rule"></div>
        <section class="object-details">
          <div class="detail-title-row">
            <span id="selected-swatch" class="selected-swatch" aria-hidden="true"></span>
            <div class="detail-title"><p class="eyebrow">SELECTED OBJECT</p><h3 id="selected-name">—</h3></div>
          </div>
          <dl class="readouts">
            <div><dt>NORAD ID</dt><dd id="selected-norad">—</dd></div>
            <div><dt>LATITUDE</dt><dd id="selected-lat">—</dd></div>
            <div><dt>LONGITUDE</dt><dd id="selected-lon">—</dd></div>
            <div><dt>ALTITUDE</dt><dd id="selected-alt">—</dd></div>
            <div><dt>SPEED</dt><dd id="selected-speed">—</dd></div>
            <div><dt>DATA EPOCH</dt><dd id="selected-epoch">—</dd></div>
          </dl>
          <p id="sampling-note" class="sampling-note"></p>
        </section>
        <div class="inspector-footer"><span class="legend-dot" aria-hidden="true"></span><span>TEME samples · spherical globe</span></div>
      </aside>
    </main>

    <footer class="timeline" aria-label="Timeline controls">
      <div class="timeline-transport">
        <button id="play-toggle" class="play-button" type="button" aria-label="Play timeline" title="Play timeline"><span aria-hidden="true">▶</span></button>
        <label class="speed-control"><span class="sr-only">Playback speed</span><select id="playback-speed" aria-label="Playback speed"><option value="1">1×</option><option value="10">10×</option><option value="60">60×</option><option value="300">300×</option></select></label>
      </div>
      <div class="timeline-track-wrap">
        <div class="timeline-labels"><time id="time-start">—</time><span class="timeline-now">UTC <b id="time-current">—</b></span><time id="time-end">—</time></div>
        <label class="sr-only" for="time-scrubber">Simulation time</label>
        <input id="time-scrubber" type="range" min="0" max="0" step="1" value="0" aria-label="Simulation time">
      </div>
      <div id="timeline-state" class="timeline-state"><span class="state-mark" aria-hidden="true"></span><span>PAUSED</span></div>
    </footer>
  </div>
  <script id="orbit-data" type="application/json">{{.Payload}}</script>
  <script>{{.JS}}</script>
</body>
</html>
