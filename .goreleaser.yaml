# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: tlego

before:
  hooks:
    - go mod download

builds:
  - id: tlego
    main: .
    binary: tlego
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/Mohammed-Ashour/tlego/cmd.Version=v{{ .Version }}

archives:
  - id: tlego
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE.md
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: github-native

release:
  prerelease: auto
  footer: |
    Satellite elements come from [CelesTrak](https://celestrak.org/). Pass and visibility results are estimates.

# Without TAP_GITHUB_TOKEN the manifests are still generated in dist/ and kept
# as a workflow artifact, so a release never fails on the package manager step.
homebrew_casks:
  - name: tlego
    binaries: [tlego]
    repository:
      owner: Mohammed-Ashour
      name: homebrew-tap
      token: '{{ index .Env "TAP_GITHUB_TOKEN" }}'
    skip_upload: '{{ if index .Env "TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/Mohammed-Ashour/tlego
    description: Track satellites and predict passes from your terminal
    license: MIT
    hooks:
      post:
        install_steps: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/tlego"]
          end

scoops:
  - name: tlego
    repository:
      owner: Mohammed-Ashour
      name: scoop-bucket
      token: '{{ index .Env "TAP_GITHUB_TOKEN" }}'
    skip_upload: '{{ if index .Env "TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    homepage: https://github.com/Mohammed-Ashour/tlego
    description: Track satellites and predict passes from your terminal
    license: MIT
